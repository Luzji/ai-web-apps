name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài thư viện tối thiểu cho test (không cần GPU, không tải mô hình thật)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi python-multipart pillow httpx pytest psutil
      - name: Pytest (API với mô hình giả)
        run: python -m pytest -q
      - name: Build React
        run: cd web && npm install --no-audit --no-fund && npm run build
